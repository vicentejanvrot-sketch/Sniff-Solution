name: Application checks
on:
  push:
    branches: [main, phase-1-foundation]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax checks
        run: npm run check
      - name: Install media renderer for thumbnail and rendering verification
        run: |
          if command -v ffmpeg >/dev/null; then
            ffmpeg -version
          else
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y ffmpeg
          fi
      - name: Core, storage, security and HTTP integration tests
        run: npm test
        env:
          FFMPEG: /usr/bin/ffmpeg
      - name: Python editorial checks
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Install isolated browser QA tools
        run: npm install --prefix /tmp/sniff-browser --no-save --ignore-scripts playwright@1.56.1
      - name: Install browser
        run: |
          if command -v google-chrome >/dev/null; then
            echo "SNIFF_TEST_BROWSER=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            /tmp/sniff-browser/node_modules/.bin/playwright install --with-deps chromium
          fi
      - name: Desktop and mobile browser smoke
        env:
          NODE_PATH: /tmp/sniff-browser/node_modules
        run: node test/browser-smoke.cjs
      - name: Phase 4 planner and analytics browser verification
        env:
          NODE_PATH: /tmp/sniff-browser/node_modules
        run: node test/phase4-browser.cjs
